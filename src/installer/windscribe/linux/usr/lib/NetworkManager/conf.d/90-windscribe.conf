# Leave Windscribe's tunnel interfaces (WireGuard, OpenVPN) alone. NetworkManager otherwise adopts
# each one as an external connection and runs its connectivity check on it, which stalls NetworkManager
# for seconds on every connect and disconnect. "+=" appends to the distribution's list instead of
# replacing it, and the 90- prefix sorts this file after distribution files that set the list with "=".
# The names must match src/helper/linux/tunnel_interface_names.h.
[keyfile]
unmanaged-devices+=interface-name:utun420;interface-name:tun420
